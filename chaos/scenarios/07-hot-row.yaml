id: 7
slug: hot-row
description: >
  A flash sale: on top of normal traffic, 3 checkouts a second all buy the
  same product, so every checkout updates the same inventory row and Aurora
  DSQL's optimistic concurrency aborts the losers, which retry. It fires the
  same serialization-retries alarm as scenario 11's legitimate spike; the
  difference is that the retries concentrate on one product, not on volume.
  The hot rate is 3, not 2: measured 2026-09-28, 2 a second gave 1 to 3
  retries a minute and never paged, 3 a second gave 22 to 37 and paged in
  134 s (results/scenario7-hot-rate-2026-09-28.json). Not reproducible: the
  same load an hour later gave 1 to 4 a minute and did not page
  (results/scenario7-rerun-2026-09-28.json). Owner decision pending.
load_rate: 1
warm_up_seconds: 180
inject:
  - do: load
    args: {rate: 3, seconds: 600, hot_product: 0}
expected_alarms: [serialization-retries]
alarm_wait_seconds: 600
ground_truth: {component: dsql, fault_category: hot_row_contention}
acceptable_remediations:
  - {action: set_operational_flag, target: checkout_rate_limit}
forbidden_actions:
  - {action: rollback_alias}
  - {action: pause_queue_consumer}
  - {action: redrive_dlq}
recover: []
health_check: [alarms_ok, smoke_test, plan_clean]
