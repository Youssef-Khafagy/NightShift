# Terraform apply. This is the approval gate.
#
# The workflow only runs when someone presses "Run workflow" on main and types
# the confirmation word. The job then waits in the "production" environment
# until the owner, its required reviewer, approves the run, and the apply role
# trusts only that environment's OIDC subject, so no other run can get AWS
# credentials. (While the repository was private, GitHub Free offered no
# environments, and the confirmation word was the whole gate.)
name: Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "apply" to confirm. Anything else stops the run.
        required: true
        type: string

permissions: {}

# Never two applies at once, and never cancel one halfway through.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.16.3
  AWS_REGION: ca-central-1

jobs:
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    # The job waits in the "production" environment until the owner, its
    # required reviewer, approves this run. The apply role trusts only that
    # environment's OIDC subject, and the environment only accepts main; a
    # run from another branch is stopped here with a readable error instead.
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - name: Check the confirmation word
        if: inputs.confirm != 'apply'
        run: |
          echo "Confirmation was '${{ inputs.confirm }}', expected 'apply'." >&2
          exit 1

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/nightshift-ci-apply
          role-session-name: nightshift-ci-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # 3.12 matches the local development Python. The host version does not
      # decide what gets installed, because the build script passes
      # --python-version 3.14 for the target runtime, but keeping them the
      # same removes one variable from the reproducibility question.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The layer zip has to exist before Terraform can hash it. Building from
      # the hash-pinned lock file means this produces the same bytes as a local
      # build, which is what keeps the plan empty when nothing changed.
      - name: Build the dependency layers
        run: |
          python -m pip install --upgrade pip
          python scripts/lambda_deps.py build
          python scripts/lambda_deps.py --layer agent build

      # The alert address is a secret, not a default in the code, because the
      # repository is public. A missing secret must stop the run here: an
      # empty address would otherwise replace the alarm subscription.
      - name: Check the alert address secret
        run: |
          if [ -z "$TF_VAR_alert_email" ]; then
            echo "The ALERT_EMAIL repository secret is not set." >&2
            exit 1
          fi

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      # Plan and apply are two steps on purpose. `terraform apply` on its own
      # would re-plan and apply whatever it found, which can differ from what
      # was reviewed. Applying a saved plan file applies exactly that plan, or
      # fails if the world moved underneath it.
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Outputs
        working-directory: terraform
        run: terraform output

      # Terraform published new versions but does not move the live aliases
      # (ignore_changes in the lambda_service module). deploy.py moves each
      # alias to exactly the version this apply published, records every move
      # in the deployments table, then runs the checkout smoke test. A green
      # apply says the infrastructure matches the configuration, not that a
      # customer can buy anything; if the smoke test fails, deploy.py puts
      # every alias back, records the rollback, and fails the job.
      - name: Deploy, smoke test, roll back on failure
        run: |
          python -m pip install --quiet boto3
          terraform -chdir=terraform output -json function_versions > versions.json
          python scripts/deploy.py --versions versions.json --sha "$GITHUB_SHA" --actor "$GITHUB_ACTOR"
