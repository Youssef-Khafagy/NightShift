# Type checking, run by CI (ci.yml, Unit tests job) and locally with
#     .venv/bin/mypy
# The files list and paths live here so both run exactly the same check.

[mypy]
python_version = 3.12
# Each Lambda has its own app.py; they are told apart as cart.app,
# orders.app and so on by treating src/ as a package root, which is also
# how they import `common` at runtime.
mypy_path = src:.
explicit_package_bases = True
namespace_packages = True
files = agent, actor, ops, evaluation, chaos, src, scripts, agent_lambda, actor_lambda
# boto3, psycopg and moto ship no type stubs we install; their calls are
# unchecked rather than failing the build.
ignore_missing_imports = True
